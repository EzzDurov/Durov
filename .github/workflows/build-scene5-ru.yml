name: Build Scene5 RU APK

on:
  push:
    branches: [scene5-ru-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout Russian resources
        uses: actions/checkout@v4
        with:
          path: translation
      - name: Checkout original Scene 5 Alpha source
        uses: actions/checkout@v4
        with:
          repository: helloklf/vtools
          ref: scene5
          path: upstream
      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-30" "build-tools;29.0.2" "ndk;21.0.6113669" "cmake;3.10.2.4988404"
      - name: Switch to Java 11 for legacy Scene Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Apply Russian translation, do not alter system settings
        run: |
          base64 -d translation/scene5-ru/ru-resources.zip.b64 > /tmp/ru-resources.zip
          unzip -oq /tmp/ru-resources.zip -d upstream
          python3 - <<'PY'
          from pathlib import Path
          root=Path('upstream')
          gradle=root/'app/build.gradle'
          content=gradle.read_text()
          if 'resConfigs "zh"' not in content:
              raise SystemExit('Unknown source language configuration')
          gradle.write_text(content.replace('resConfigs "zh"','resConfigs "zh", "ru"'))
          for name in ('local.properties','app/local.properties'):
              (root/name).unlink(missing_ok=True)
          for path in root.rglob('*.gradle'):
              s=path.read_text()
              if 'jcenter()' in s:
                  path.write_text(s.replace('jcenter()', 'mavenCentral()'))
          import xml.etree.ElementTree as ET
          for module in ('app','common','krscript'):
              f=root/module/'src/main/res/values-ru/strings.xml'
              ET.parse(f)
              print('Translated resources OK',f)
          PY
      - name: Build Russian APK (debug signed)
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify signed APK
        run: |
          mkdir -p dist
          APK=$(find upstream/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -s "$APK"
          cp "$APK" dist/Scene5_RU.apk
          "$ANDROID_HOME/build-tools/29.0.2/apksigner" verify --verbose dist/Scene5_RU.apk
          ls -lh dist/Scene5_RU.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Scene5_RU_APK
          path: dist/Scene5_RU.apk
          if-no-files-found: error
